name: Unity Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unity-tests:
    name: Unity Tests
    # runs-on: [self-hosted, linux, x64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UNITY_SECRETS: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: Validate Unity secrets
        if: env.HAS_UNITY_SECRETS != 'true'
        run: |
          echo "::error::UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD must be configured for manual Unity test runs."
          exit 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: EmptyHouse/Library
          key: Library-${{ hashFiles('EmptyHouse/Assets/**', 'EmptyHouse/Packages/manifest.json', 'EmptyHouse/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        id: editmode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: EmptyHouse
          testMode: EditMode
          unityVersion: auto
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload EditMode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: ${{ steps.editmode.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 7

      - name: Run PlayMode tests
        id: playmode
        if: always()
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: EmptyHouse
          testMode: PlayMode
          unityVersion: auto
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Test Results

      - name: Upload PlayMode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-playmode-results
          path: ${{ steps.playmode.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 7
